name: Build AutoIllegals

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source

      - name: Locate Maven project
        run: |
          POM=$(find build-source -name pom.xml | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Maven project: $PROJECT_DIR"

      - name: Build plugin
        run: |
          cd "$PROJECT_DIR"
          mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoIllegals-JAR
          path: |
            ${{ env.PROJECT_DIR }}/target/*.jar
          if-no-files-found: error
