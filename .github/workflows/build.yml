name: Build AutoIllegals

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find AutoIllegals ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AutoIllegals project ZIP was not found."
            exit 1
          fi

          echo "Found project ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP contents:"
          unzip -l "$ZIP_FILE"

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$ZIP_FILE" -d build-source

      - name: Locate pom.xml
        shell: bash
        run: |
          set -e

          echo "Searching for pom.xml..."

          POM=$(find "$GITHUB_WORKSPACE/build-source" \
            -type f \
            -name "pom.xml" \
            -print -quit)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml was not found inside the ZIP."
            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/build-source" -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")

          echo "Found pom.xml:"
          echo "$POM"

          echo "Maven project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build AutoIllegals
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo "Project files:"
          ls -la

          mvn -B clean package

      - name: Find built JAR
        shell: bash
        run: |
          set -e

          echo "Searching for JAR..."

          find "$PROJECT_DIR/target" \
            -type f \
            -name "*.jar" \
            -print

      - name: Upload AutoIllegals JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoIllegals-JAR
          path: "${{ env.PROJECT_DIR }}/target/*.jar"
          if-no-files-found: error
