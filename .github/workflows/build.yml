name: Build AutoIllegals

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Extract AutoIllegals project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AutoIllegals ZIP file was not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf build-source
          mkdir build-source

          unzip -q "$ZIP_FILE" -d build-source

          echo "Extracted files:"
          find build-source -maxdepth 3 -type f | head -100

      - name: Find Maven project
        shell: bash
        run: |
          set -e

          POM=$(find build-source -type f -name "pom.xml" | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml was not found inside the AutoIllegals ZIP."
            echo "Files found:"
            find build-source -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")

          echo "Found pom.xml: $POM"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build AutoIllegals
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          mvn -B clean package

      - name: Upload AutoIllegals JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoIllegals-JAR
          path: "${{ env.PROJECT_DIR }}/target/*.jar"
          if-no-files-found: error
